site_url: "https://www.missingmaps.org/"

backend:
  name: github
  repo: "MissingMaps/mm-website-v2"
  branch: main
  base_url: "https://decap-oauth.themissingmaps1.workers.dev"
  auth_endpoint: "auth"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "collections/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"

    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }

      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        required: false
        hint: "Turn this OFF to save the post as a draft — it will not appear on the live site until you turn it back on and publish."

      - { label: "Title", name: "title", widget: "string" }

      # Banner can be an uploaded image OR an external URL:
      - label: "Banner"
        name: "banner"
        widget: "string"
        required: false
        hint: "Paste an image URL (https://...) OR upload an image and paste its path."

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true

      - { label: "Author", name: "author", widget: "string", required: false }

      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }

      - label: "Categories"
        name: "categories"
        widget: "text"
        required: false
        hint: "IMPORTANT: Please paste categories inside [] and seperate them with commas (,) Example [field mapping, MSF, africa]"

      - label: "Permalink"
        name: "permalink"
        widget: "string"
        required: false
        default: "/blog/:year/:month/:day/:title/"
        hint: "Optional. Default: /blog/:year/:month/:day/:title/. If needed for translations, add a language prefix e.g. /fr/blog/:year/:month/:day/:title/."

      - label: "Language"
        name: "lang"
        widget: "select"
        options: ["en", "fr", "cs", "es"]
        default: "en"
      
      - label: "Post ID"
        name: "postID"
        widget: "string"
        required: false
        hint: "Optional. Internal identifier (e.g. MM-2023-annual-report-highlights-Cameroon)."

      - { label: "Body", name: "body", widget: "markdown" }
  
  - name: "current-projects"
    label: "Current Projects"
    folder: "collections/_projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:

      - label: Mapping tool
        name: category
        widget: select
        options:
          - label: HOT Tasking Manager
            value: TM
          - label: MapRoulette
            value: MR
          - label: MapSwipe
            value: MS
        default: TM

      - label: Project name
        name: title
        widget: string

      - label: Project URL
        name: external_url
        widget: string

      - label: "Date - no need to change anything"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: true
        default: "{{now}}"        

      - label: "RSS Feed Notification Settings"
        name: "feed"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "I want to notify the Missing Maps community about this project via Slack and the RSS feed"
            name: "include_in_feed"
            widget: "boolean"
            default: false
            hint: "Toggle on to include this project in the public RSS feed at /projects-feed.xml and send an automatic message to channel on HOT Slack."
          - label: "Slack / RSS message"
            name: "excerpt"
            widget: "text"
            required: false
            hint: "Max 495 characters. Leave empty for default: 'New Missing Maps mapping request'"

